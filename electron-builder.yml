appId: com.d2lhub.desktop
productName: D2L Hub
copyright: Copyright © 2026 D2L Hub

directories:
  output: release
  buildResources: build

# The renderer and the bundled Express server are loaded from disk, so the app
# ships unpacked — this also keeps Node's ESM loader away from asar paths.
asar: false
npmRebuild: false

files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Auto-update feed. The packaged app reads this from resources/app-update.yml and
# checks GitHub Releases. Releases (and this repository) must be public: a
# private repository would need a token shipped inside the app.
publish:
  provider: github
  owner: Kalabuna156
  repo: d2l-hub

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: D2L Hub
  createDesktopShortcut: true

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  icon: build/icon.png
  category: Education
  synopsis: Dark-mode D2L (Brightspace) dashboard
  maintainer: D2L Hub <noreply@example.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
